services:
  web:
    build:
      context: .
      dockerfile: frontend/Containerfile
    ports:
      - "8088:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: backend
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      DB_URL: jdbc:postgresql://db:5432/areas_instintos
      DB_USER: areas
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8088}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/q/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 10
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: areas_instintos
      POSTGRES_USER: areas
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U areas -d areas_instintos"]
      interval: 5s
      timeout: 3s
      retries: 12
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
