quarkus.http.port=8080
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:areas}
quarkus.datasource.password=${DB_PASSWORD:areas-local}
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/areas_instintos}
quarkus.hibernate-orm.schema-management.strategy=none
quarkus.flyway.migrate-at-start=true
quarkus.jackson.fail-on-unknown-properties=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGIN:http://localhost:8088}
quarkus.http.cors.methods=POST,OPTIONS
quarkus.http.cors.headers=Content-Type
quarkus.log.category."io.quarkus.http.access-log".level=OFF
app.turnstile.secret=${TURNSTILE_SECRET:}

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:areas;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.flyway.migrate-at-start=true
%test.app.turnstile.secret=

%local.quarkus.datasource.db-kind=h2
%local.quarkus.datasource.jdbc.url=jdbc:h2:mem:areas-local;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%local.quarkus.datasource.username=sa
%local.quarkus.datasource.password=
%local.quarkus.flyway.migrate-at-start=true
%local.quarkus.http.cors.origins=http://localhost:8088
%local.app.turnstile.secret=
